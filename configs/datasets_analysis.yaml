# Dataset Analysis Configuration
# Simplified config for exploring and analyzing datasets
# No train/test splits - just load all available data for analysis
#
# This config is used for:
# - Dataset property analysis
# - Visualization and exploration
# - Quality checks
# - Statistical analysis
#
