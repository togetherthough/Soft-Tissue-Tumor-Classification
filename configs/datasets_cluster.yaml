# GPU Cluster configuration
# Use absolute paths to /data/scratch/ where datasets are stored on the cluster
# Data location: /data/scratch/r112276/{dataset_name}/
# Code location: /trinity/home/r112276/Med3Tab-PFN/
# For local machine use, see datasets.yaml with relative paths

datasets:
  gist:
    dataset_root: /data/scratch/r112276/gist
    category: gist
    ct_name: ct_GIST
    labels:
      sheet_csv: sheet.csv
      dataset_name: GIST
      subject_col: Subject
      label_col: Diagnosis_binary
      case_suffix: _CT
    prepare:
      case_glob: null
      max_cases: null
    split:
      ratio: 0.8
      seed: 2025
    extraction:
      img_size: 128

  lipo:
    dataset_root: /data/scratch/r112276/lipo
    category: lipo
    ct_name: ct_LIPO
    labels:
      sheet_csv: sheet.csv
      dataset_name: Lipo
      subject_col: Subject
      label_col: Diagnosis_binary
      case_suffix: _MR
    prepare:
      case_glob: null
      max_cases: null
    split:
      ratio: 0.8
      seed: 2025
    extraction:
      img_size: 128
