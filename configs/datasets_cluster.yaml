# GPU Cluster configuration
# Use absolute paths to /data/scratch/ where datasets are stored on the cluster
# Data location: /data/scratch/r112276/{dataset_name}/
# Code location: /trinity/home/r112276/Med3Tab-PFN/
# For local machine use, see datasets.yaml with relative paths
#
# SHARED sheet.csv: All datasets use the same sheet.csv file
# Located at: /data/scratch/r112276/sheet.csv
# Just copy your sheet.csv once to this location!
#
# NOTE: Dataset names are CASE-SENSITIVE!
# All 6 datasets configured with correct names from sheet.csv:
# - CRLM (77 samples), Desmoid (203), GIST (246), Lipo (115), Liver (186), Melanoma (103)

datasets:
  crlm:
    dataset_root: /data/scratch/r112276/crlm
    category: crlm
    ct_name: ct_CRLM
    labels:
      sheet_csv: /data/scratch/r112276/sheet.csv
      dataset_name: CRLM  # Check sheet.csv for exact name
      subject_col: Subject
      label_col: Diagnosis_binary
      case_suffix: _CT
    prepare:
      case_glob: null
      max_cases: null
      segmentation_pattern: "segmentation_lesion0_RAD.nii.gz"  # CRLM-specific segmentation naming
    split:
      ratio: 0.8
      seed: 2025
    extraction:
      img_size: 128

  desmoid:
    dataset_root: /data/scratch/r112276/desmoid
    category: desmoid
