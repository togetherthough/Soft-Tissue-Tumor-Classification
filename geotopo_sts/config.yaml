# GeoTopo-STS Configuration
# ========================

# Dataset paths (GIST CT)
data:
  root_dir: '../data/gist'  # Path to GIST dataset
  structure: 'gist_ct'  # Dataset type: gist_ct, custom, etc.
  image_filename: 'image.nii.gz'  # Image file name
  mask_filename: 'mask.nii.gz'  # Mask file name (or segmentation.nii.gz)
  modality: 'ct'  # ct or mri

# Data preprocessing
preprocessing:
  target_spacing: [1.5, 1.5, 1.5]  # mm isotropic
  crop_padding: 25  # voxels on each side
  rim_radius_mm: 10.0  # peritumoral rim size
  intensity:
    mri:
      percentile_clip: [1, 99]
      bias_correction: true
      normalization: 'zscore'  # or 'muscle_roi'
    ct:
      window: [-150, 350]  # HU for soft tissue window
      normalization: 'zscore'
      clip_values: [-1024, 3071]  # Standard CT HU range
  crop_size: [160, 160, 160]  # final crop size

# Geometry extraction
geometry:
  mesh:
    smooth_kernel: [3, 3, 3]
    laplacian_smooth_iters: 10
    laplacian_lambda: 0.5
    target_vertices: 8000
    feature_channels: 9  # mean_curv, gauss_curv, shape_idx, curv, surf_int, in_int, out_int, dist_centroid, dist_rim
    edge_knn: 8
  skeleton:
    enabled: false  # optional, turn on for skeleton graph
    min_branch_length_mm: 6.0
    merge_nodes_threshold_mm: 3.0

# Topology (persistent homology)
topology:
  filtrations:
    tumor_dims: [0, 1, 2]  # distance transform
    rim_dims: [0, 1]  # intensity
  persistence_image:
    sigma_mm: 3.0
    grid_size: 16
    weight_alpha: 0.75
  pca_dims: 128

# Model architecture
model:
  voxel:
    in_channels: 1
    width: 32
    out_channels: 256
    backbone: 'resnet'  # or 'mamba'
  
  mesh_gnn:
    in_channels: 8
    hidden: 128
    layers: 4
    out_channels: 256
    type: 'egnn'  # or 'e3nn'
  
  topology_mlp:
    in_channels: 128
    hidden: 128
    out_channels: 64
    dropout: 0.2
  
  fusion:
    method: 'gated'  # gated MLP
    out_channels: 256
  
  head:
    type: 'euclidean'  # or 'hyperbolic'
    n_classes: 50  # adjust to your taxonomy
    hierarchy:
      enabled: true
      lambda: 0.3  # ancestor smoothing weight

# Training
training:
  optimizer:
    name: 'adamw'
    lr_voxel: 3.0e-4
    lr_graph: 1.0e-3
    lr_mlp: 1.0e-3
    weight_decay: 0.05
  
  scheduler:
    name: 'onecycle'  # or 'cosine'
    pct_start: 0.2
    warmup_epochs: 10
  
  batch_size: 2
  gradient_accumulation: 4  # effective batch = 8
  epochs: 200
  mixed_precision: true
  num_workers: 4
  
  loss:
    ce_weight: 1.0
    hierarchy_weight: 0.3
    class_balance: 'sqrt_inv'  # freq^-0.5
    arcface:
      enabled: false
      margin: 0.25
      scale: 30
  
  checkpointing:
    save_top_k: 5
    monitor: 'val_macro_f1'
    mode: 'max'

# Augmentation
augmentation:
  rotation_degrees: 25
  flip_prob: 0.5
  elastic:
    enabled: true
    sigma_mm: 5.0
    alpha_mm: 15.0
  intensity:
    gamma_range: [0.8, 1.2]
    noise_std: 0.02
    bias_field: true
  crop_jitter: 10  # voxels

# Evaluation
evaluation:
  metrics:
    - 'macro_f1'
    - 'balanced_accuracy'
    - 'hierarchical_accuracy'
    - 'ece'  # calibration
    - 'brier'
  
  robustness_tests:
    rotation_angles: [0, 45, 90]
    missing_modality: false
  
  split:
    method: 'hospital'  # hospital-level split
    val_size: 0.15
    test_size: 0.15
    random_seed: 42

# Ablations (toggle components)
ablations:
  use_rim: true
  use_topology: true
  use_mesh: true
  use_skeleton: false
  hierarchical_loss: true
