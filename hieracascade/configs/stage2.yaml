# Stage-2 Configuration: Crops → hierarchical classification

model:
  name: stage2_swin3d_b  # or stage2_swin3d_s
  emb_dim: 768  # Embedding dimension
  pool: set_transformer  # Options: set_transformer, attention_mil, gated_attention_mil
  n_fine: 6  # melanoma, crlm, gist, lipo, desmoid, liver
  n_coarse: 3  # malignant, benign, other
  
  # Pooling-specific parameters
  pooling_kwargs:
    num_heads: 4
    num_inds: 4  # For Set Transformer
    num_layers: 2  # For Set Transformer
    dropout: 0.1

train:
  epochs: 40
  lr: 1.5e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  alpha: 0.3  # Weight for coarse CE loss
  beta: 0.1  # Weight for hierarchical consistency loss
  batch_size: 1  # Studies per GPU (each with K crops)
  focal_gamma: 0.0  # Set to 2.0 for Focal Loss
  use_class_weights: false

# Crop proposals from Stage-1 saliency
proposals:
  K: 8  # Number of crops per study
  crop_size: 96  # Edge length of crop cube
  nms_dist: 16  # NMS distance threshold in voxels
  top_p: 0.005  # Top percentile for peak detection

# Geometry (must match Stage-1 for saliency generation)
geom:
  spacing: 1.5
  size_stage1: [192, 192, 192]  # Stage-1 input size
  size_crop: [96, 96, 96]  # Crop size
