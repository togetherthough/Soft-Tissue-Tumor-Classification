# Stage-1 Configuration: Full volume → coarse predictions + saliency

model:
  name: stage1_swin3d_t  # or stage1_swin3d_s
  n_classes: 6  # melanoma, crlm, gist, lipo, desmoid, liver
  embed_dim: 96
  saliency_channels: 1

train:
  epochs: 20
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  lam_sparsity: 1.0e-3  # Weight for saliency sparsity loss
  batch_size: 2  # Per GPU for 192^3 volumes
  focal_gamma: 0.0  # Set to 2.0 for Focal Loss
  use_class_weights: false  # Enable after epoch 10 if needed
  site_balanced: true  # Use site-balanced sampler
  
  # Augmentation settings
  aug:
    enabled: true
    elastic: true
    gamma: true
    affine_deg: 10
    blur: true
    noise: true

# Geometry and preprocessing
geom:
  spacing: 1.5  # Target isotropic spacing in mm
  size: [192, 192, 192]  # Target volume dimensions

# Intensity normalization
intensity:
  modality: ct_mri
  ct_hu_clip: [-150, 250]
  mri_clip: [2, 98]  # Percentiles
